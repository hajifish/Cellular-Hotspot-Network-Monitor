name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package macOS app (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build & self-test (release)
        run: |
          swift build -c release
          TRAFFICMONITOR_SELFTEST=1 .build/release/TrafficMonitor

      - name: Package (zip + dmg)
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME}" dist

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" \
          dist/TrafficMonitor-*.zip dist/TrafficMonitor-*.dmg --clobber

      - name: Upload artifacts (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitor-${{ github.ref_name }}
          path: dist/TrafficMonitor-*
